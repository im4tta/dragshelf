name: Publish verified release artifacts
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful build workflow run ID
        required: true
        type: string
      release_tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source run and application source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          case "$SOURCE_RUN" in *[!0-9]*|'') exit 1;; esac
          case "$RELEASE_TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) exit 1;; esac
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")"
          test "$(printf '%s' "$run" | jq -r .conclusion)" = success
          test "$(printf '%s' "$run" | jq -r .name)" = 'Build and release Windows and macOS'
          sha="$(printf '%s' "$run" | jq -r .head_sha)"
          git diff --exit-code "$RELEASE_TAG" "$sha" -- src build windows package.json package-lock.json electron-builder.yml
          version="$(git show "$RELEASE_TAG:package.json" | jq -r .version)"
          test "v$version" = "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          pattern: DragShelf-*
          path: dist
          merge-multiple: true
      - name: Validate expected installers
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          v="${RELEASE_TAG#v}"
          for suffix in windows-x64-setup.exe windows-x64-portable.exe mac-arm64.dmg mac-x64.dmg mac-universal.dmg mac-arm64.zip mac-x64.zip mac-universal.zip; do
            test -s "dist/DragShelf-${v}-${suffix}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
