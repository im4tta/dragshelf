name: Build and release Windows and macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to a GitHub Release on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libasound2t64 libgtk-3-0 libnss3
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Install test fixture dependency
        run: python3 -m pip install Pillow
      - name: End-to-end self test (real Electron app under Xvfb)
        run: xvfb-run -a npm test
      - run: npm run test:unit
      - name: Khmer localization checks
        run: xvfb-run -a npm run test:khmer

  mac:
    needs: test
    runs-on: macos-latest          # Apple Silicon runner; builds x64 + arm64 + universal
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # Without an Apple Developer certificate the app is ad-hoc signed (works, but Gatekeeper asks once).
      - name: Build (ad-hoc signed)
        if: env.CSC_LINK == ''
        run: |
          unset CSC_LINK
          npx electron-builder --mac --x64 --arm64 --universal --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false

      # With secrets CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      # the build is Developer-ID signed and notarized, so it opens without any warning.
      - name: Build (signed + notarized)
        if: env.CSC_LINK != ''
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --x64 --arm64 --universal --publish never -c.mac.notarize=true

      - name: Show architectures
        run: |
          for d in dist/mac dist/mac-arm64 dist/mac-universal; do
            [ -d "$d" ] && lipo -archs "$d/Drag Shelf.app/Contents/MacOS/Drag Shelf" | sed "s|^|$d: |"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: DragShelf-macOS
          path: |
            dist/*.dmg
            dist/*.zip
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npm ci
      - name: Build Windows desktop context helper
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /MT /utf-8 /DNOMINMAX windows\desktop-helper.cpp /Fe:build\win-helper.exe /Fo:build\win-helper.obj /link user32.lib shell32.lib
      - name: Windows end-to-end tests
        run: npm test
      - name: Display size and scaling checks
        run: npm run test:display
      - name: Khmer localization checks
        run: npm run test:khmer
      - name: Build shared UI installer and portable executable
        run: npx electron-builder --win --x64 --publish never
      - name: Test packaged Windows application
        shell: powershell
        run: |
          $env:DRAGSHELF_TEST_EXE = Join-Path $PWD 'dist/win-unpacked/DragShelf.exe'
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:khmer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows UI screenshots
        run: npm run screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: DragShelf-Windows
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-UI-preview
          path: docs/screenshots-windows/*.png

  release:
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: DragShelf-*
          path: dist
          merge-multiple: true
      - name: Attach Windows and macOS builds to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
