name: Microsoft Store MSIX

on:
  push:
    branches: [main]
    paths: ['windows/**', 'scripts/package-store.ps1', '.github/workflows/store.yml', 'build/icon.png', 'package.json', 'PRIVACY.md']
  pull_request:
    paths: ['windows/**', 'scripts/package-store.ps1', '.github/workflows/store.yml', 'build/icon.png', 'package.json', 'PRIVACY.md']
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Exact Package/Identity/Name from Partner Center'
        required: true
        type: string
      publisher:
        description: 'Exact Package/Identity/Publisher (CN=...) from Partner Center'
        required: true
        type: string
      publisher_display_name:
        description: 'Exact Package/Properties/PublisherDisplayName from Partner Center'
        required: true
        type: string
      display_name:
        description: 'Reserved Store display name'
        required: true
        default: Drag Shelf
        type: string

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and validate MSIX
        shell: powershell
        env:
          STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
          STORE_DISPLAY_NAME: ${{ inputs.display_name }}
          STORE_BUILD_EVENT: ${{ github.event_name }}
        run: |
          if ($env:STORE_BUILD_EVENT -eq 'workflow_dispatch') {
            ./scripts/package-store.ps1 -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME -DisplayName $env:STORE_DISPLAY_NAME
          } else {
            ./scripts/package-store.ps1 -ValidationOnly
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DragShelf-MSIX-${{ github.run_number }}
          path: |
            dist/*.msix
            dist/msix-*/Assets/StoreListingLogo.png
          if-no-files-found: error
