appId: com.santhon.dragshelf
productName: Drag Shelf
copyright: MIT License
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - build/trayTemplate*.png
  - build/dragicon.png
  - build/icon.png
  - package.json
  - "!**/node_modules/uiohook-napi/prebuilds/linux*/**"
  - "!**/node_modules/uiohook-napi/{libuiohook,src}/**"
  - "!**/node_modules/**/{test,tests,docs,*.md,*.map}"
npmRebuild: false      # uiohook-napi ships N-API prebuilds for darwin-x64 and darwin-arm64
asarUnpack:
  - "**/*.node"
mac:
  # Both architecture-specific prebuilds are shipped unchanged in each app.
  x64ArchFiles: "**/uiohook-napi/prebuilds/darwin-*/*.node"
  category: public.app-category.productivity
  icon: build/icon.icns
  # Menu-bar app: no Dock icon, no app-switcher entry.
  extendInfo:
    LSUIElement: true
    NSHumanReadableCopyright: MIT License
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  target: [dmg, zip]
artifactName: DragShelf-${version}-mac-${arch}.${ext}
win:
  target: [nsis, portable]
  icon: build/icon.png
  executableName: DragShelf
  extraResources:
    - from: build/win-helper.exe
      to: win-helper.exe
nsis:
  artifactName: DragShelf-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Drag Shelf
portable:
  artifactName: DragShelf-${version}-windows-${arch}-portable.${ext}
  requestExecutionLevel: user
dmg:
  title: Drag Shelf ${version}
  icon: build/icon.icns
  contents:
    - { x: 150, y: 190 }
    - { x: 390, y: 190, type: link, path: /Applications }
  window: { width: 540, height: 380 }
