<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Drag Shelf</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="shelf.css">
</head>
<body>
  <div id="frame">
    <main id="card">
      <header id="top">
        <div id="grip" title="Drag to move" data-i18n-title="dragMove"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <nav id="tabs"></nav>
        <button id="addTab" title="New shelf" data-i18n-title="newShelf">+</button>
        <span id="counter" title="Done / total on this shelf" data-i18n-title="doneTotal">0/0</span>
        <button id="captureBtn" class="icon" title="Capture screen" data-i18n-title="captureScreen"></button>
        <button id="historyBtn" class="icon" title="History" data-i18n-title="history"></button>
        <button id="phoneBtn" class="icon" title="Photos from phone" data-i18n-title="phoneMenu"></button>
        <button id="closeBtn" class="icon" title="Hide shelf" data-i18n-title="hideShelf"></button>
      </header>

      <div id="listWrap">
        <ul id="list"></ul>
        <div id="insert"></div>
      </div>

      <section id="empty">
        <div class="zone">
          <div class="zone-ico"></div>
          <div class="zone-t" data-i18n="emptyTitle">Drop files, links, text or images here</div>
          <div class="zone-s">Or drag something and shake the mouse</div>
        </div>
      </section>

      <footer id="foot">
        <div id="dragAll" draggable="true" title="Drag everything on this shelf at once" data-i18n-title="dragAllHint"></div>
        <button id="undoBtn" class="icon" title="Undo" data-i18n-title="undo"></button>
        <button id="redoBtn" class="icon" title="Redo" data-i18n-title="redo"></button>
        <span class="sp"></span>
        <button id="clearDone" class="link" data-i18n="clearDone">Clear done</button>
        <button id="clearAll" class="link danger" data-i18n="clearAll">Clear all</button>
      </footer>
      <button id="prepareBtn" class="prepare-entry" data-i18n="prepareDelivery">Prepare a delivery</button>

      <section id="history" class="panel" hidden>
        <div class="panel-top"><button class="icon" data-close title="Back" data-i18n-title="back"></button><strong data-i18n="history">History</strong><span class="sp"></span>
          <label class="switch" title="Auto-paste copied items" data-i18n-title="autoPaste"><input type="checkbox" id="autoPaste"><span></span><em data-i18n="autoPaste">Auto-paste copied items</em></label></div>
        <div class="panel-tools"><input id="historySearch" type="search" placeholder="Search history" data-i18n-placeholder="searchHistory"><button id="pasteBtn" class="icon" title="Paste clipboard to shelf" data-i18n-title="pasteNow"></button></div>
        <ul id="historyList"></ul>
        <p id="historyEmpty" class="panel-empty" data-i18n="historyEmpty">Everything you add or copy appears here.</p>
        <div class="panel-foot"><button id="newSnippet" class="link" data-i18n="newSnippet" data-i18n-title="snippetHint">New snippet</button><span class="sp"></span><button id="clearHistory" class="link danger" data-i18n="clearHistory">Clear history</button></div>
      </section>

      <section id="textTools" class="panel" hidden>
        <div class="panel-top"><button class="icon" data-close title="Back" data-i18n-title="back"></button><strong id="textName"></strong></div>
        <textarea id="textBody" spellcheck="false"></textarea>
        <div class="panel-tools sep-row"><label><span data-i18n="separator">Separator</span> <input id="sep" value=","></label>
          <span class="chips"><button data-sep=",">,</button><button data-sep="\n">↵</button><button data-sep="\t">⇥</button><button data-sep=";">;</button><button data-sep="|">|</button><button data-sep=" ">␠</button></span></div>
        <div class="panel-tools opts"><label><input type="checkbox" id="optTrim" checked> <span data-i18n="trimParts">Trim</span></label><label><input type="checkbox" id="optUnique"> <span data-i18n="uniqueParts">Unique</span></label>
          <span class="sp"></span><button id="textUndo" class="icon" title="Undo" data-i18n-title="undo"></button><button id="textRedo" class="icon" title="Redo" data-i18n-title="redo"></button></div>
        <div class="panel-tools actions"><button id="doSplit" class="pill" data-i18n="splitLines">Split</button><button id="doMerge" class="pill" data-i18n="mergeLines">Merge</button><span class="sp"></span><button id="saveText" class="pill accent" data-i18n="saveText">Save</button></div>
        <div class="panel-foot"><button id="splitItems" class="link" data-i18n="splitItems">Split into items</button><span class="sp"></span><button id="mergeItems" class="link" data-i18n="mergeItems">Merge text items</button></div>
      </section>
      <section id="rules" class="panel" hidden>
        <div class="panel-top"><button class="icon" data-close title="Back" data-i18n-title="back"></button><strong data-i18n="smartShelves">Smart shelves</strong></div>
        <p class="panel-note" data-i18n="smartShelvesHint">New items that match go to that shelf.</p>
        <ul id="ruleList"></ul>
        <div class="panel-tools rule-form"><select id="ruleKind" aria-label="Rule"><option value="ext" data-i18n="ruleExt">File type is</option><option value="name" data-i18n="ruleName">Name contains</option></select>
          <input id="ruleValue" placeholder="pdf, png" aria-label="Value"><span>→</span><select id="ruleShelf" aria-label="Shelf"></select></div>
        <div class="panel-foot"><span class="sp"></span><button id="addRule" class="pill accent" data-i18n="addRule">Add rule</button></div>
      </section>

      <section id="commands" class="panel" hidden>
        <input id="cmdInput" type="search" autocomplete="off" placeholder="Type a command" data-i18n-placeholder="searchCommands" role="combobox" aria-controls="cmdList" aria-expanded="true">
        <ul id="cmdList" role="listbox" aria-label="Commands"></ul>
      </section>
      <div id="toast" role="status"></div>

      <div id="dropHint" data-i18n="dropAdd">Drop to add</div>
      <div id="confetti"></div>
    </main>
  </div>
  <script src="icons.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/textops.js"></script>
  <script src="locale.js"></script>
  <script src="drop.js"></script>
  <script src="shelf.js"></script>
</body>
</html>
