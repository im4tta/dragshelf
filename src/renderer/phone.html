<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Photos from phone</title>
<link rel="stylesheet" href="common.css">
<style>
  body { width: 100%; height: 100%; padding: 14px; }
  .card { width: 300px; height: min(484px, calc(100vh - 28px)); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--circle) transparent; border-radius: 28px; background: var(--bg); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 22px 22px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .ico { width: 44px; height: 44px; border-radius: 14px; background: var(--tile-open-bg); color: var(--tile-open-fg); display: grid; place-items: center; margin-bottom: 12px; flex: none; }
  h1 { font-size: 18px; font-weight: 650; margin: 0 0 14px; letter-spacing: -.01em; }
  .qr { width: 214px; height: 214px; background: #fff; border-radius: 18px; padding: 6px; display: grid; place-items: center; box-shadow: 0 0 0 4px var(--circle); flex: none; }
  .qr svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
  .cap { margin-top: 14px; font-size: 13px; font-weight: 550; }
  .sub { margin-top: 4px; font-size: 12px; color: var(--dim); line-height: 1.45; }
  .count { margin-top: auto; margin-bottom: 12px; flex: none; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; color: var(--accent); }
  .count b { background: var(--accent); color: var(--accent-fg); border-radius: 999px; min-width: 24px; height: 24px; display: inline-grid; place-items: center; padding: 0 8px; font-variant-numeric: tabular-nums; }
  .btn { width: 100%; flex: none; cursor: pointer; } .btn:hover { background: var(--circle-hover); }
</style></head>
<body>
  <div class="card">
    <div class="ico" id="ico"></div>
    <h1>Photos from your phone</h1>
    <div class="qr" id="qr"></div>
    <div class="cap">Scan with your phone’s camera</div>
    <div class="sub">Same Wi-Fi required. Photos arrive<br>on the shelf; nothing leaves your network.</div>
    <div class="count">Received <b id="n">0</b></div>
    <button class="btn" id="stop">Stop and close</button>
  </div>
  <script src="icons.js"></script>
  <script src="phone.js"></script>
</body></html>
