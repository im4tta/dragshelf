<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Change shortcut</title>
<link rel="stylesheet" href="common.css">
<style>
  body { width: 100%; height: 100%; padding: 14px; }
  .card { width: 352px; height: 192px; border-radius: 26px; background: var(--bg); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 22px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 17px; font-weight: 650; margin: 0 0 16px; letter-spacing: -.01em; }
  .keys { display: flex; gap: 8px; height: 40px; align-items: center; justify-content: center; }
  .keys .keycap { height: 40px; min-width: 40px; font-size: 18px; background: var(--circle); }
  .keys .keycap.ghost { background: transparent; box-shadow: inset 0 0 0 2px var(--circle); color: var(--faint); }
  .keys.ok .keycap { background: var(--accent); color: var(--accent-fg); }
  .keys.bad .keycap { background: color-mix(in srgb, var(--danger) 30%, var(--bg)); color: var(--danger); }
  .hint { margin-top: auto; font-size: 12px; color: var(--dim); line-height: 1.5; min-height: 36px; }
  .hint.bad { color: var(--danger); }
</style></head>
<body>
  <div class="card">
    <h1>Press the new shortcut</h1>
    <div class="keys" id="keys"></div>
    <div class="hint" id="hint">Use <b>⌃</b> <b>⌥</b> <b>⇧</b> or <b>⌘</b> together with a key.<br>Esc cancels.</div>
  </div>
  <script src="shortcut.js"></script>
</body></html>
